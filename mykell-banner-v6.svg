<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b8ff"/>
      <stop offset="20%" stop-color="#00e0c0"/>
      <stop offset="40%" stop-color="#5fd400"/>
      <stop offset="60%" stop-color="#ffd400"/>
      <stop offset="80%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff3d3d"/>
    </linearGradient>
    <linearGradient id="cipherGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" fill="none" stroke="#1f2637" stroke-width="1"/>

  <!-- unique shield-ribbon logo: one continuous gradient ribbon folded into a shield with a keyhole -->
  <g transform="translate(150,150)">
    <path d="M 0 -68
             C 34 -50, 60 -42, 60 -42
             L 60 6
             C 60 42, 34 62, 0 76
             C -34 62, -60 42, -60 6
             L -60 -42
             C -60 -42, -34 -50, 0 -68 Z"
          fill="none" stroke="url(#ribbon)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- keyhole punched through the ribbon -->
    <circle cx="0" cy="-2" r="12" fill="#0a0e1a"/>
    <path d="M -6 6 L 6 6 L 3 24 L -3 24 Z" fill="#0a0e1a"/>
  </g>

  <!-- name lockup -->
  <text x="270" y="120" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="1" fill="#f2f4f8">
    MYKELL <tspan fill="url(#cipherGrad)">CIPHERBYTE</tspan>
  </text>

  <line x1="270" y1="150" x2="820" y2="150" stroke="#242c40" stroke-width="1.5"/>

  <!-- tagline row -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="0.5">
    <path d="M 270 190 L 270 181 A 7.5 7.5 0 0 1 285 181 L 285 190 L 285 199 A 7.5 9 0 0 1 277.5 208 A 7.5 9 0 0 1 270 199 Z"
          fill="none" stroke="#4db8ff" stroke-width="2.3"/>
    <text x="298" y="204" fill="#e8ecf5">CYBERSECURITY</text>

    <line x1="486" y1="182" x2="486" y2="206" stroke="#3a4258" stroke-width="1.5"/>

    <rect x="510" y="190" width="19" height="19" rx="3" fill="none" stroke="#4db8ff" stroke-width="2.2"/>
    <circle cx="519.5" cy="199.5" r="4.5" fill="none" stroke="#4db8ff" stroke-width="1.8"/>
    <text x="543" y="204" fill="#e8ecf5">TECH</text>

    <line x1="608" y1="182" x2="608" y2="206" stroke="#3a4258" stroke-width="1.5"/>

    <rect x="632" y="197" width="5" height="12" fill="#5fd400"/>
    <rect x="641" y="191" width="5" height="18" fill="#5fd400"/>
    <rect x="650" y="183" width="5" height="26" fill="#5fd400"/>
    <text x="668" y="204" fill="#e8ecf5">FX</text>
  </g>
</svg>
